name: Scrape AU Indian Cinema

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout scraper repo
        uses: actions/checkout@v4

      - name: Checkout data repo
        uses: actions/checkout@v4
        with:
          repository: text2027mail/ausnz-data
          token: ${{ secrets.AUSNZ_PAT }}
          path: data-repo

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests cloudscraper brotli

      - name: Run scraper
        env:
          HOYTS_PROXY: ${{ secrets.HOYTS_PROXY }}
          EVENT_PROXIES: ${{ secrets.EVENT_PROXIES }}
        run: python aus.py

      - name: Move data into data-repo
        run: |
          mkdir -p "data-repo/australia boxoffice"
          mkdir -p "data-repo/australia advance"
          if [ -d "australia boxoffice" ]; then
            cp -r "australia boxoffice/." "data-repo/australia boxoffice/"
          fi
          if [ -d "australia advance" ]; then
            cp -r "australia advance/." "data-repo/australia advance/"
          fi

      - name: Commit and push
        run: |
          cd data-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
